[package]
name = "tong-fetch"
description = "Registry fetching: sparse index, version resolution, crate downloads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ureq = "3"
gix = { version = "0.86", default-features = false, features = ["sha1", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
tar = "0.4"
flate2 = "1"
tracing.workspace = true
tong-core = { path = "../tong-core" }
tong-store = { path = "../tong-store" }
toml = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
