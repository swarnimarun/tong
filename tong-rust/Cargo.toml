[package]
name = "tong-rust"
description = "Rust backend: target model, toolchain capture, action planning"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tong-core = { path = "../tong-core" }
tong-exec = { path = "../tong-exec" }
tong-graph = { path = "../tong-graph" }
tong-store = { path = "../tong-store" }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
semver = "1"
lzma-rs = "0.3"
tar = "0.4"
flate2 = "1"
tong-fetch = { path = "../tong-fetch" }

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
semver = { version = "1", features = ["serde"] }
tong-fetch = { path = "../tong-fetch" }
flate2 = "1"
tar = "0.4"
