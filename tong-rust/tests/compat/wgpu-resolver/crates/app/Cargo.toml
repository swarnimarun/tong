[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
alpha1 = { package = "alpha", version = "=1.0.0" }
alpha2 = { package = "alpha", version = "=2.0.0" }
extra = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
unix-only = { path = "../unix-only" }

[target.'cfg(windows)'.dependencies]
win-only = { path = "../win-only" }

[features]
default = []
full = ["dep:extra", "extra/feat"]
