# `tests/compat/<name>/` is a Cargo workspace; `pass` asserts full package
# set, version, feature, and edge equality against `cargo metadata`.
#
# Statuses:
#   pass         - resolver equality asserted; the fixture must match cargo.
#   unsupported  - import must fail with a targeted diagnostic.
#   divergent    - import succeeds; the documented divergence is recorded.
