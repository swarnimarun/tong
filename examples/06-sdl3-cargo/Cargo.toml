# The SDL3 bindings as a plain Cargo package (the "SDL3 via Cargo"
# example): the native library is linked through the build script's
# `cargo:` directives, which both cargo and tong consume. Consumed by
# examples/05-voxel-city-cargo as an external path dependency.
[workspace]
resolver = "2"
members = ["crates/sdl3-sys"]
