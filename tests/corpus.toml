# The pinned external corpus: the checked-in source of truth for the
# `tong-corpus-runner`. `fetch` clones each entry at the exact `rev`,
# verifies the checkout, and populates the per-entry cargo home and Tong
# store; `resolve` compares tong's resolver graph against `cargo metadata
# --locked --offline`; `build` executes the entry's Tong gate offline.
#
# Required entries must pass every gate; extended entries record observed
# evidence and never block. `gate` selects the acceptance semantics:
#   default - resolver equality + the entry's `tong` command
#   tokio   - full-workspace metadata equality + `tong test --workspace
#             --all-features --no-run --offline`
#   wgpu    - full-workspace resolver equality + `tong check` of the five
#             selected packages with `--all-features --offline`

[entries.tokio]
url = "https://github.com/tokio-rs/tokio"
rev = "75fef53d0a8590c2d1dbb63672aa7b7d1ef51155"
tier = "required"
gate = "tokio"
platforms = ["all"]

[entries.wgpu]
url = "https://github.com/gfx-rs/wgpu"
rev = "8bf3e5ff4ab45e2c150e0d6c70d01d25f5b126c1"
tier = "required"
gate = "wgpu"
platforms = ["all"]

[entries.serde]
url = "https://github.com/serde-rs/serde"
rev = "7fc3b4c30c94f73a96ebd1553f2b090d928fc3a8"
tier = "required"
tong = ["check", "--workspace", "--all-targets", "--offline"]
platforms = ["all"]

[entries.syn]
url = "https://github.com/dtolnay/syn"
rev = "23dbaab4b0c43f56cd803894054cf366661e53b0"
tier = "required"
tong = ["check", "-p", "syn", "--lib", "--features", "full,visit,visit-mut,fold,extra-traits", "--release", "--offline"]
platforms = ["all"]

