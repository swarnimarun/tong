[workspace]
resolver = "3"
members = [
    "tong",
    "tong-core",
    "tong-exec",
    "tong-fetch",
    "tong-graph",
    "tong-rust",
    "tong-store",
    "tools/corpus-runner",
]
# Pinned external corpus checkouts live under target/tong-corpus; keep
# cargo's workspace discovery from walking up into the repo root.
exclude = ["target/tong-corpus"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# `asm` enables SHA-NI/ARMv8 SHA-256 hardware acceleration (sha2-asm).
# Same algorithm, identical digests — throughput only.
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3"
serde = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
