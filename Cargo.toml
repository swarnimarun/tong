[workspace]
resolver = "3"
members = [
    "tong",
    "tong-core",
    "tong-exec",
    "tong-fetch",
    "tong-graph",
    "tong-rust",
    "tong-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = "0.10"
tempfile = "3"
serde = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
